name: Build TITU AI Assistant APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 'latest'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Verify project ZIP
        run: |
          ls -la
          test -f TITU_AI_Assistant_Android_Project.zip

      - name: Extract Android project
        run: |
          unzip -o TITU_AI_Assistant_Android_Project.zip -d unpacked
          test -d unpacked/TITU_AI_Assistant_Android
          ls -la unpacked/TITU_AI_Assistant_Android

      - name: Build debug APK
        working-directory: unpacked/TITU_AI_Assistant_Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITU-AI-Assistant-APK
          path: unpacked/TITU_AI_Assistant_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7