name: Build TITU AI Assistant APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip TITU_AI_Assistant_Android_Project.zip -d unpacked

      - name: Build APK
        working-directory: unpacked/TITU_AI_Assistant_Android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TITU-AI-Assistant-APK
          path: unpacked/TITU_AI_Assistant_Android/app/build/outputs/apk/debug/app-debug.apk
          
